<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; width: 250px; padding: 12px; margin: 0; }
    h2 { font-size: 14px; margin: 0 0 10px; }
    h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #888; margin: 12px 0 5px; }
    label { display: block; font-size: 12px; margin-bottom: 3px; color: #333; }
    select { font-size: 12px; padding: 3px 5px; border: 1px solid #ccc; border-radius: 3px; width: 100%; margin-bottom: 4px; }
    .note { font-size: 11px; color: #888; margin: 0 0 8px; }
    .saved { font-size: 11px; color: #28a745; opacity: 0; transition: opacity .3s; }
    .saved.show { opacity: 1; }
    hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
    a { font-size: 11px; color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>MOC Source</h2>

  <h3>Buy page — store filter</h3>
  <label for="storeLocation">Store location</label>
  <select id="storeLocation">
    <option value="anywhere">Anywhere</option>
    <optgroup label="Region">
      <option value="region:Africa">Africa</option>
      <option value="region:Asia">Asia</option>
      <option value="region:Australia &amp; Oceania">Australia &amp; Oceania</option>
      <option value="region:Europe">Europe</option>
      <option value="region:European Union">European Union</option>
      <option value="region:Middle East">Middle East</option>
      <option value="region:North America">North America</option>
      <option value="region:South America">South America</option>
    </optgroup>
    <optgroup label="Country" id="countryGroup">
      <!-- populated by popup.js from cached BrickLink country list -->
    </optgroup>
  </select>
  <label><input type="checkbox" id="filterLotsOverMax"> Auto-check "Lots over max price"</label>
  <label><input type="checkbox" id="filterLotsBelowQty"> Auto-check "Lots below Wanted qty"</label>

  <h3>PAB price region</h3>
  <label for="pabRegion">Show prices for</label>
  <select id="pabRegion">
    <optgroup label="North America">
      <option value="en-us">United States</option>
      <option value="en-ca">Canada</option>
    </optgroup>
    <optgroup label="Europe">
      <option value="en-gb">United Kingdom</option>
      <option value="de-de">Germany</option>
      <option value="fr-fr">France</option>
      <option value="nl-nl">Netherlands</option>
      <option value="es-es">Spain</option>
      <option value="it-it">Italy</option>
      <option value="pt-pt">Portugal</option>
      <option value="sv-se">Sweden</option>
      <option value="nb-no">Norway</option>
      <option value="da-dk">Denmark</option>
      <option value="fi-fi">Finland</option>
      <option value="pl-pl">Poland</option>
      <option value="cs-cz">Czech Republic</option>
    </optgroup>
    <optgroup label="Oceania">
      <option value="en-au">Australia</option>
      <option value="en-nz">New Zealand</option>
    </optgroup>
  </select>

  <span class="saved" id="savedMsg">Saved</span>

  <hr>
  <a href="https://api.moc-source.com/health" target="_blank">API status</a>

  <script src="popup.js"></script>
</body>
</html>
